name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    environment: esteira-release
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conferir que o commit está na main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" fetch origin "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Commit $(git rev-parse --short HEAD) está na main."
          else
            echo "A tag aponta para $(git rev-parse --short HEAD), que não está na main."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Conferir tag
        run: node scripts/conferir-tag.mjs
      - run: npm ci
      - name: Exigir assinatura
        run: node --experimental-strip-types scripts/exigir-assinatura.ts
      - name: Build
        run: npm run dist:win
      - name: Conferir publisherName
        shell: bash
        run: |
          arquivos=()
          while IFS= read -r arquivo; do
            arquivos+=("$arquivo")
          done < <(find release -name app-update.yml -print)
          test "${#arquivos[@]}" -gt 0
          for arquivo in "${arquivos[@]}"; do
            node --experimental-strip-types scripts/conferir-app-update.ts "$arquivo"
          done
      - name: Publicar rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/latest.yml
          tag="$GITHUB_REF_NAME"
          notas="Instalador Windows da Esteira, em rascunho. A atualização lê o feed configurado na máquina."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft
            gh release upload "$tag" release/*.exe release/*.exe.blockmap release/latest.yml
          else
            gh release create "$tag" release/*.exe release/*.exe.blockmap release/latest.yml --draft --title "$tag" --notes "$notas"
          fi
