name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run smoke
      - run: npx electron-builder --linux dir --publish never
      - name: Fumaça do app empacotado
        run: |
          bin=release/linux-unpacked/esteira
          if [ ! -x "$bin" ]; then bin=release/linux-unpacked/Esteira; fi
          test -x "$bin"
          xvfb-run -a node scripts/smoke-electron.mjs "$bin"
      - run: npm run scan-secrets
      - run: npm audit --audit-level=high

  instalador-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Fumaça do app desempacotado
        run: node scripts/smoke-electron.mjs release/win-unpacked/Esteira.exe
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: release/*.exe
          if-no-files-found: error
